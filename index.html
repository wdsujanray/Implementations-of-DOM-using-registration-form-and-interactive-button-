<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Magic · Registration + Interactive 3D Text</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0d1b2a, #030a13 90%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ========== ANIMATED BACKGROUND PARTICLES ========== */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatParticle 14s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-40px) translateX(30px) scale(1.2); opacity: 0.7; }
            100% { transform: translateY(-100px) translateX(-30px) scale(0.8); opacity: 0; }
        }

        /* ========== BLINKING EYES ANIMATION ========== */
        .eyes-animation {
            position: fixed;
            top: 25px;
            right: 30px;
            display: flex;
            gap: 18px;
            z-index: 10;
            opacity: 0.9;
            pointer-events: none;
            filter: drop-shadow(0 0 15px #3b82f6);
        }

        .eye {
            width: 38px;
            height: 38px;
            background: #e0f2fe;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px #38bdf8, 0 0 50px #38bdf8;
            animation: blink 3.5s infinite ease-in-out;
            border: 2px solid #bae6fd;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background: #0c4a6e;
            border-radius: 50%;
            top: 9px;
            left: 9px;
            animation: look 6s infinite alternate;
        }

        @keyframes blink {
            0%, 45%, 55%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.08); }
        }

        @keyframes look {
            0% { transform: translate(0, 0); }
            25% { transform: translate(8px, -3px); }
            50% { transform: translate(-5px, 4px); }
            75% { transform: translate(6px, -5px); }
            100% { transform: translate(0, 0); }
        }

        .eye::before {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 50%;
            top: -8px;
            left: -8px;
            animation: ringPulse 2s infinite alternate;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.1; }
        }

        /* ========== CONTAINER ========== */
        .container {
            max-width: 1350px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.2rem;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 880px) {
            .container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            .eyes-animation {
                top: 10px;
                right: 15px;
                transform: scale(0.7);
            }
        }

        /* ========== CARD STYLE ========== */
        .card {
            background: rgba(12, 22, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 2.5rem;
            padding: 2rem 2rem;
            border: 1px solid rgba(80, 150, 255, 0.25);
            box-shadow: 0 35px 55px -15px #000000, 0 0 0 1px rgba(59, 130, 246, 0.2) inset, 0 0 40px rgba(37, 99, 235, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            color: #eef2ff;
            display: flex;
            flex-direction: column;
            animation: cardFloat 5s infinite alternate ease-in-out;
        }

        @keyframes cardFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .card:hover {
            animation-play-state: paused;
            box-shadow: 0 45px 70px -15px #000, 0 0 0 1px #3b82f6 inset, 0 0 60px rgba(59, 130, 246, 0.3);
        }

        h2 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.02em;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            color: #ffffff;
            text-shadow: 0 0 20px #3b82f6;
        }

        h2 span {
            background: linear-gradient(145deg, #2563eb, #1e40af);
            padding: 0.2rem 0.9rem;
            border-radius: 60px;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 25px #2563eb;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .subtitle {
            color: #93c5fd;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 400;
        }

        /* ========== FORM ========== */
        .form-group {
            margin-bottom: 1.3rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #b9d2f0;
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 1rem 1.3rem;
            border-radius: 20px;
            border: 2px solid #253a55;
            background: #0b1424;
            font-size: 1rem;
            color: white;
            outline: none;
            transition: 0.2s;
            font-weight: 400;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6);
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 5px rgba(59, 130, 246, 0.25), inset 0 4px 12px #000;
            background: #0e1a2e;
        }

        input::placeholder {
            color: #4a6382;
        }

        /* ========== BUTTONS ========== */
        .btn {
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.02em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 12px 22px -6px #000;
            background: linear-gradient(145deg, #1e3a8a, #2563eb);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn:hover {
            background: linear-gradient(145deg, #2563eb, #3b82f6);
            transform: scale(1.03);
            box-shadow: 0 18px 30px -8px #1e3a8a, 0 0 25px #3b82f6;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: linear-gradient(145deg, #1e293b, #2d3f5e);
            color: #bbd6fc;
            box-shadow: 0 8px 18px -5px #0a0f18;
            border: 1px solid #3b4f6e;
        }

        .btn-secondary:hover {
            background: linear-gradient(145deg, #2d3f5e, #3b4f6e);
            box-shadow: 0 12px 25px -5px #0a0f18, 0 0 20px #3b82f6;
            color: white;
        }

        .btn-reset {
            background: linear-gradient(145deg, #2a1e2e, #3d1b1b);
            color: #fca5a5;
            border: 1px solid #7f1d1d;
        }

        .btn-reset:hover {
            background: linear-gradient(145deg, #3d1b1b, #5a1f1f);
            color: #fecaca;
            box-shadow: 0 0 20px #ef4444;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: 0.8rem;
        }

        /* ========== OUTPUT BOX (WHITE BACKGROUND) ========== */
        .output-box {
            background: #ffffff;
            border-radius: 28px;
            padding: 1.8rem 1.5rem;
            margin-top: 1.8rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 0 35px rgba(59, 130, 246, 0.25), inset 0 0 25px rgba(0, 0, 0, 0.02);
            transition: 0.2s;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .output-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6, #8b5cf6, #3b82f6);
            background-size: 300% 100%;
            animation: borderGlow 4s infinite linear;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 0; }
            100% { background-position: 300% 0; }
        }

        /* ========== WELCOME LOADING ANIMATION ========== */
        .welcome-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            width: 100%;
            padding: 1rem;
        }

        .loader-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 5px solid #dbeafe;
            border-top: 5px solid #3b82f6;
            border-right: 5px solid #8b5cf6;
            animation: spinLoader 1s linear infinite;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);
        }

        @keyframes spinLoader {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .welcome-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e3a8a;
            letter-spacing: 0.05em;
            text-align: center;
            animation: welcomePulse 1.5s infinite alternate;
        }

        @keyframes welcomePulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .welcome-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* ========== REGISTRATION OUTPUT (WHITE BG) ========== */
        .reg-display {
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            width: 100%;
            animation: fadeSlideIn 0.6s ease-out;
        }

        @keyframes fadeSlideIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .user-details .name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .user-details .email {
            font-size: 1.05rem;
            color: #2563eb;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .barcode-area {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            background: #f8fafc;
            border-radius: 22px;
            padding: 1rem 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .barcode-svg {
            filter: drop-shadow(0 4px 8px rgba(59, 130, 246, 0.3));
            transition: 0.3s;
            border-radius: 10px;
        }

        .barcode-svg:hover {
            filter: drop-shadow(0 6px 16px rgba(59, 130, 246, 0.5));
        }

        .barcode-label {
            font-family: 'Inter', monospace;
            font-size: 0.85rem;
            letter-spacing: 3px;
            background: #1e293b;
            padding: 0.25rem 1.2rem;
            border-radius: 30px;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 10px rgba(30, 41, 59, 0.3);
        }

        .id-code {
            font-family: 'SF Mono', monospace;
            color: #1e40af;
            font-size: 1.1rem;
            word-break: break-all;
            background: #dbeafe;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid #bfdbfe;
        }

        /* ========== INTERACTIVE COUNTER ========== */
        .counter-section {
            background: #0a1322;
            border-radius: 32px;
            padding: 1.6rem 1.8rem;
            margin-bottom: 1.5rem;
            border: 1px solid #1e3a8a;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.15), inset 0 0 25px #000;
        }

        .counter-display {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            color: #60a5fa;
            text-shadow: 0 0 40px #3b82f6, 0 0 20px #1e3a8a;
            transition: 0.1s;
            line-height: 1.2;
            animation: counterPulse 2s infinite alternate;
            letter-spacing: -0.03em;
        }

        @keyframes counterPulse {
            0% { text-shadow: 0 0 25px #3b82f6, 0 0 12px #1e3a8a; transform: scale(1); }
            100% { text-shadow: 0 0 55px #60a5fa, 0 0 30px #3b82f6; transform: scale(1.02); }
        }

        .counter-label {
            text-align: center;
            color: #93c5fd;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        /* ========== 3D EFFECT TEXT ========== */
        .three-d-text {
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            animation: text3DFloat 3s infinite alternate ease-in-out;
            transition: 0.3s;
            padding: 1rem;
        }

        @keyframes text3DFloat {
            0% { transform: translateY(0) rotateX(0deg) rotateY(0deg); }
            100% { transform: translateY(-10px) rotateX(3deg) rotateY(-2deg); }
        }

        .three-d-text:hover {
            animation-play-state: paused;
            text-shadow: 
                0 1px 0 #3b82f6,
                0 2px 0 #2563eb,
                0 3px 0 #1e40af,
                0 4px 0 #1e3a8a,
                0 5px 0 #172554,
                0 6px 1px rgba(0,0,0,.2),
                0 0 5px rgba(59,130,246,.5),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
        }

        /* ========== GREETING MESSAGE ========== */
        .greeting-box {
            background: #0a1322;
            border-radius: 24px;
            padding: 1.5rem 1.8rem;
            margin-top: 1.5rem;
            border-left: 8px solid #3b82f6;
            font-size: 1.1rem;
            transition: 0.2s;
            min-height: 6rem;
            display: flex;
            align-items: center;
            box-shadow: inset 0 0 30px #000;
            animation: greetingGlow 3s infinite alternate;
        }

        @keyframes greetingGlow {
            0% { border-left-color: #3b82f6; }
            100% { border-left-color: #8b5cf6; }
        }

        .greeting-box strong {
            color: #60a5fa;
        }

        /* ========== TOGGLE STATE ========== */
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1e3a8a;
        }

        .toggle-btn {
            background: #1e293b;
            color: #b9d2f0;
            border: 2px solid #3b4f6e;
            padding: 0.7rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            transition: 0.2s;
            min-width: 120px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 15px #000;
        }

        .toggle-btn.active {
            background: linear-gradient(145deg, #10b981, #059669);
            color: #022c22;
            border-color: #34d399;
            box-shadow: 0 0 30px #10b981, 0 0 60px #059669;
            font-weight: 800;
            transform: scale(1.02);
        }

        .small-note {
            font-size: 0.8rem;
            color: #5d7ba3;
            margin-top: 0.8rem;
            text-align: right;
            font-style: italic;
        }

        /* ========== ANIMATIONS FOR INTERACTIVE PAGE ========== */
        .flash-animation {
            animation: flash 0.5s ease-out;
        }

        @keyframes flash {
            0% { background: #1e3a8a; transform: scale(1); }
            30% { background: #3b82f6; transform: scale(1.01); }
            100% { background: #0a1322; transform: scale(1); }
        }

        .pulse-btn {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 550px) {
            .card { padding: 1.6rem; }
            h2 { font-size: 1.6rem; }
            .btn { padding: 0.8rem 1.3rem; font-size: 0.9rem; }
            .counter-display { font-size: 3rem; }
            .three-d-text { font-size: 2.2rem; }
            .user-details .name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <!-- animated background particles -->
    <div class="bg-particles" id="particles"></div>
    
    <!-- eyes animation -->
    <div class="eyes-animation">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>

    <div class="container">
        <!-- ========== 1) REGISTRATION FORM ========== -->
        <section class="card">
            <h2><span>1</span> Registration</h2>
            <div class="subtitle">Live DOM · QR Code · White Output</div>

            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" placeholder="e.g. Ada Lovelace" value="Ada Lovelace">
            </div>
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="ada@example.com" value="ada@computing.org">
            </div>
            <div class="form-group">
                <label for="password">Password (hidden in output)</label>
                <input type="password" id="password" placeholder="••••••••" value="domdemo123">
            </div>

            <div class="btn-row">
                <button class="btn pulse-btn" id="registerBtn">✨ Register & Generate</button>
                <button class="btn btn-secondary" id="clearFormBtn">Clear</button>
            </div>

            <!-- registration output with white background -->
            <div class="output-box" id="regOutput">
                <div style="color: #64748b; text-align: center; padding: 0.5rem; font-size: 1.1rem;">
                    ⏳ Fill the form and click Register
                </div>
            </div>
        </section>

        <!-- ========== 2) INTERACTIVE PAGE ========== -->
        <section class="card">
            <h2><span>2</span> Interactive</h2>
            <div class="subtitle">Counter · 3D Text · Toggle · Greet</div>

            <!-- counter with animation -->
            <div class="counter-section">
                <div class="counter-label">LIVE COUNTER</div>
                <div class="counter-display" id="counterDisplay">0</div>
                <div class="btn-row" style="justify-content: center; margin-top: 1rem;">
                    <button class="btn" id="incrementBtn" style="padding: 0.7rem 1.5rem;">➕ Increment</button>
                    <button class="btn btn-secondary" id="decrementBtn" style="padding: 0.7rem 1.5rem;">➖ Decrement</button>
                    <button class="btn btn-reset" id="resetCounterBtn" style="padding: 0.7rem 1.5rem;">Reset</button>
                </div>
            </div>

            <!-- 3D effect text area -->
            <div class="three-d-text" id="threeDText">DOM</div>

            <!-- greet button -->
            <button class="btn" id="greetBtn" style="width: 100%; margin-bottom: 1rem; font-size: 1.1rem; padding: 1rem;">👋 Say Hello (DOM update)</button>
            <div class="greeting-box" id="greetMessage">
                <span style="color: #93c5fd;">— click the button to change this message —</span>
            </div>

            <!-- toggle active state -->
            <div class="toggle-row">
                <span style="font-weight: 600; color: #b9d2f0;">🔘 Toggle active state</span>
                <button class="toggle-btn" id="toggleBtn">Inactive</button>
            </div>
            <div class="small-note">classList.toggle() changes style + text</div>
        </section>
    </div>

    <script>
        (function() {
            // ========== BACKGROUND PARTICLES ==========
            const particlesContainer = document.getElementById('particles');
            function createParticles() {
                const count = 45;
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    const size = Math.random() * 25 + 5;
                    particle.style.width = size + 'px';
                    particle.style.height = size + 'px';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    particle.style.animationDelay = Math.random() * 15 + 's';
                    particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                    particle.style.opacity = Math.random() * 0.5 + 0.1;
                    const hue = Math.random() * 60 + 190;
                    particle.style.background = `radial-gradient(circle, hsl(${hue}, 90%, 65%, 0.5), transparent 80%)`;
                    particlesContainer.appendChild(particle);
                }
            }
            createParticles();

            // ========== 1) REGISTRATION FORM ==========
            const fullNameInput = document.getElementById('fullName');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const registerBtn = document.getElementById('registerBtn');
            const clearBtn = document.getElementById('clearFormBtn');
            const regOutput = document.getElementById('regOutput');

            function escapeHtml(str) {
                return str.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // Generate a QR-code style SVG from user data
            function generateQRSVG(seedStr) {
                let hash = 0;
                for (let i = 0; i < seedStr.length; i++) {
                    hash = ((hash << 5) - hash) + seedStr.charCodeAt(i);
                    hash |= 0;
                }
                const absHash = Math.abs(hash);
                const size = 120;
                const cellSize = 8;
                const cells = size / cellSize;
                let rects = '';
                
                // Generate a pseudo-random pattern
                for (let y = 0; y < cells; y++) {
                    for (let x = 0; x < cells; x++) {
                        const bit = ((absHash >> ((x * 7 + y * 13) % 30)) & 1) || ((x * y + x + y) % 3 === 0);
                        if (bit) {
                            rects += `<rect x="${x * cellSize}" y="${y * cellSize}" width="${cellSize - 0.5}" height="${cellSize - 0.5}" fill="#0f172a" rx="1"/>`;
                        }
                    }
                }
                
                // Add finder patterns (QR corners)
                const finderPattern = (fx, fy) => {
                    return `<rect x="${fx}" y="${fy}" width="24" height="24" fill="#0f172a" rx="2"/>
                            <rect x="${fx + 4}" y="${fy + 4}" width="16" height="16" fill="#ffffff" rx="1"/>
                            <rect x="${fx + 8}" y="${fy + 8}" width="8" height="8" fill="#2563eb" rx="1"/>`;
                };
                
                return `<svg class="barcode-svg" width="${size + 20}" height="${size + 20}" viewBox="0 0 ${size + 20} ${size + 20}" xmlns="http://www.w3.org/2000/svg">
                    <rect width="${size + 20}" height="${size + 20}" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="2"/>
                    <g transform="translate(10, 10)">
                        ${rects}
                        ${finderPattern(0, 0)}
                        ${finderPattern(size - 24, 0)}
                        ${finderPattern(0, size - 24)}
                    </g>
                </svg>`;
            }

            function handleRegister() {
                const name = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!name || !email || !password) {
                    regOutput.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 0.5rem; font-size: 1.1rem;">⚠️ All fields are required.</div>`;
                    return;
                }
                if (!email.includes('@') || !email.includes('.')) {
                    regOutput.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 0.5rem; font-size: 1.1rem;">⚠️ Please enter a valid email address.</div>`;
                    return;
                }

                // Show welcome loading animation first
                regOutput.innerHTML = `
                    <div class="welcome-loader">
                        <div class="loader-ring"></div>
                        <div class="welcome-text">Welcome <span class="welcome-dots"></span></div>
                    </div>
                `;

                // After loading animation, show registration data
                setTimeout(() => {
                    const safeName = escapeHtml(name);
                    const safeEmail = escapeHtml(email);
                    const seed = name + email;
                    const qrSVG = generateQRSVG(seed);
                    const mockId = 'ID-' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');

                    regOutput.innerHTML = `
                        <div class="reg-display">
                            <div class="user-details">
                                <div class="name">👤 ${safeName}</div>
                                <div class="email">✉️ ${safeEmail}</div>
                            </div>
                            <div class="barcode-area">
                                ${qrSVG}
                                <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                    <span class="barcode-label">SCAN ME</span>
                                    <span class="id-code">${mockId}</span>
                                </div>
                            </div>
                            <div style="font-size: 0.85rem; color: #64748b; text-align: right; margin-top: 0.4rem;">
                                ⚡ DOM updated · ${new Date().toLocaleTimeString()}
                            </div>
                        </div>
                    `;
                    regOutput.classList.add('flash-animation');
                    setTimeout(() => regOutput.classList.remove('flash-animation'), 500);
                }, 1800);
            }

            function clearForm() {
                fullNameInput.value = '';
                emailInput.value = '';
                passwordInput.value = '';
                regOutput.innerHTML = `
                    <div style="color: #64748b; text-align: center; padding: 0.5rem; font-size: 1.1rem;">
                        🗑️ Form cleared. Ready for new registration.
                    </div>
                `;
            }

            registerBtn.addEventListener('click', handleRegister);
            clearBtn.addEventListener('click', clearForm);

            [fullNameInput, emailInput, passwordInput].forEach(input => {
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        handleRegister();
                    }
                });
            });

            // ========== 2) INTERACTIVE PAGE ==========
            // Counter
            let counter = 0;
            const counterDisplay = document.getElementById('counterDisplay');
            const incrementBtn = document.getElementById('incrementBtn');
            const decrementBtn = document.getElementById('decrementBtn');
            const resetCounterBtn = document.getElementById('resetCounterBtn');
            const threeDText = document.getElementById('threeDText');

            function updateCounterDisplay() {
                counterDisplay.textContent = counter;
                counterDisplay.style.transform = 'scale(1.15)';
                setTimeout(() => { counterDisplay.style.transform = 'scale(1)'; }, 120);
                
                // Update 3D text based on counter
                const words = ['DOM', 'LIVE', 'MAGIC', 'CODE', 'POWER'];
                const idx = Math.abs(counter) % words.length;
                threeDText.textContent = words[idx];
                
                // Add rotation based on counter
                const rotation = (counter * 15) % 360;
                threeDText.style.transform = `perspective(500px) rotateY(${rotation}deg)`;
            }

            incrementBtn.addEventListener('click', () => {
                counter++;
                updateCounterDisplay();
            });

            decrementBtn.addEventListener('click', () => {
                counter--;
                updateCounterDisplay();
            });

            resetCounterBtn.addEventListener('click', () => {
                counter = 0;
                updateCounterDisplay();
            });

            // Greeting
            const greetBtn = document.getElementById('greetBtn');
            const greetMessage = document.getElementById('greetMessage');

            greetBtn.addEventListener('click', () => {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                const userName = fullNameInput.value.trim() || 'guest';
                greetMessage.innerHTML = `
                    <span style="font-weight: 800; color: #60a5fa; font-size: 1.2rem;">👋 Hello, ${escapeHtml(userName)}!</span><br>
                    <span style="font-size: 1rem; color: #b9d2f0;">DOM updated at <strong style="color: #93c5fd;">${timeString}</strong>.</span>
                    <span style="margin-left: 10px; display: inline-block; animation: blink 1.2s infinite; font-size: 1.4rem;">✨</span>
                `;
                greetMessage.classList.add('flash-animation');
                setTimeout(() => greetMessage.classList.remove('flash-animation'), 500);
            });

            // Toggle button
            const toggleBtn = document.getElementById('toggleBtn');
            let isActive = false;

            toggleBtn.addEventListener('click', function() {
                isActive = !isActive;
                toggleBtn.classList.toggle('active', isActive);
                toggleBtn.textContent = isActive ? 'Active ✓' : 'Inactive';
            });

            // Initial display
            updateCounterDisplay();
        })();
    </script>
</body>
</html>
